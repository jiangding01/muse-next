name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      # 一个平台失败时其余平台仍跑完，各自留下证据。
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Electron runtime codec probe (M3 T1a)
        run: npm run test:electron-codec
      # 根 tsconfig 不含 scripts/m3：单独检查 IPC smoke 的 runner 与判定器。
      - name: Typecheck Electron IPC smoke runner (M3 T1b-2b-1)
        run: npm run typecheck:electron-ipc
      # ubuntu-24.04 限制非特权 user namespace，Chromium 的 namespace 沙箱无法初始化（CI run 38135665466）。
      # 只为本次 npm 安装的那一个 Electron 可执行文件加载 unconfined + userns 的专用 profile（Ubuntu 官方机制）；
      # 不改 sysctl、不动 chrome-sandbox 属主 / 权限、不关闭 AppArmor。
      - name: Allow user namespaces for the Electron binary via AppArmor (M3 T1b-2b-1, Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::环境诊断（只读）"
          . /etc/os-release && echo "os=${PRETTY_NAME}"
          echo "kernel=$(uname -r)"
          echo "apparmor_enabled=$(cat /sys/module/apparmor/parameters/enabled)"
          echo "kernel.apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          echo "apparmor_parser=$(command -v apparmor_parser)"
          echo "::endgroup::"
          ELECTRON="$(readlink -f "$(node -p "require('electron')")")"
          test -f "${ELECTRON}" && test -x "${ELECTRON}"
          case "${ELECTRON}" in *[\*\?\[\]\{\}\^\"]*) echo "Electron path contains AppArmor glob characters: ${ELECTRON}"; exit 1 ;; esac
          echo "electron=${ELECTRON}"
          stat -c 'chrome-sandbox owner=%U:%G mode=%a (诊断，不修改)' "$(dirname "${ELECTRON}")/chrome-sandbox"
          PROFILE=/etc/apparmor.d/muse-next-electron-ci
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\n\nprofile muse-next-electron-ci "%s" flags=(unconfined) {\n  userns,\n}\n' "${ELECTRON}" | sudo tee "${PROFILE}"
          sudo apparmor_parser -r "${PROFILE}"
          sudo aa-status | grep -F 'muse-next-electron-ci'
          # 进程标签自检：让同一个 Electron 可执行文件读取自己的 AppArmor 标签。RunAsNode 只作为本条命令的前缀
          # （不 export，不传给后续 smoke），只用于这次身份检查，不替代任何真实窗口测试。
          SELF_CHECK="$(ELECTRON_RUN_AS_NODE=1 "${ELECTRON}" -e 'const fs = require("fs"); let label = null; let file = null; for (const f of ["/proc/self/attr/apparmor/current", "/proc/self/attr/current"]) { try { label = fs.readFileSync(f, "utf8").replace(/\0/g, "").trim(); file = f; break; } catch (error) { console.error("cannot read " + f + ": " + error.message); } } if (label === null) process.exit(3); console.log("exe=" + fs.readlinkSync("/proc/self/exe")); console.log("electron=" + (process.versions.electron || "")); console.log("file=" + file); console.log("label=" + label);')"
          echo "${SELF_CHECK}"
          SELF_EXE="$(printf '%s\n' "${SELF_CHECK}" | sed -n 's/^exe=//p')"
          SELF_VERSION="$(printf '%s\n' "${SELF_CHECK}" | sed -n 's/^electron=//p')"
          SELF_LABEL="$(printf '%s\n' "${SELF_CHECK}" | sed -n 's/^label=//p')"
          test "${SELF_EXE}" = "${ELECTRON}" || { echo "self-check ran ${SELF_EXE}, expected ${ELECTRON}"; exit 1; }
          test -n "${SELF_VERSION}" || { echo "self-check did not run inside Electron"; exit 1; }
          LABEL_RE='^muse-next-electron-ci( \([a-z]+\))?$'
          [[ "${SELF_LABEL}" =~ ${LABEL_RE} ]] || { echo "Electron AppArmor label is '${SELF_LABEL}', expected profile muse-next-electron-ci"; exit 1; }
          echo "AppArmor self-check OK: ${SELF_EXE} (Electron ${SELF_VERSION}) runs under '${SELF_LABEL}'"
      # 真实 BrowserWindow + 生产 preload + 默认 sandbox；Linux 另加虚拟显示。不加任何关闭沙箱的参数。
      - name: Electron real-window IPC smoke (M3 T1b-2b-1)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron-ipc
        timeout-minutes: 15
      - name: Electron real-window IPC smoke (M3 T1b-2b-1)
        if: runner.os != 'Linux'
        run: npm run test:electron-ipc
        timeout-minutes: 15
      - name: JCX fixture matrix report (M1.8 T4, no corpus)
        run: npm run jcx:fixture-report
