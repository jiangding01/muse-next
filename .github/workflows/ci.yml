name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Electron runtime codec probe (M3 T1a)
        run: npm run test:electron-codec
      - name: JCX fixture matrix report (M1.8 T4, no corpus)
        run: npm run jcx:fixture-report
